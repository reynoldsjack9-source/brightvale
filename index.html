<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Brightvale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one full-window stage; a 16:9 game canvas centered; menus overlay the whole stage */
:root{
  --sky:#8fd3ff; --deep:#1f3b63; --panel:#ffffff; --ink:#2b2140; --muted:#6b6485;
  --sun:#ffc93c; --leaf:#5cc44a; --berry:#ff6b8b; --mana:#4aa3ff; --line:#d9e6f5;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(#bfe6ff,#e9f7ff);background-color:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding-block:10px;box-sizing:border-box}
#wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(31,59,99,.25);background:var(--sky)}
#game{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;
  background:rgba(143,211,255,.55);backdrop-filter:blur(3px);overflow:auto;box-sizing:border-box}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,64px);color:#fff;letter-spacing:.01em;line-height:1;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.sub{font-weight:800;color:var(--deep);margin-top:-4px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(100%,880px)}
@media (max-width:720px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 5px 0 var(--ink);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);outline:none;border-color:#000}
.card:focus-visible{box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--sun)}
.card canvas{width:100%;height:120px;border-radius:12px;background:linear-gradient(#bfe8ff,#e8f8ff)}
.card h2{font-family:var(--display);font-weight:700;font-size:24px;margin:2px 0 0}
.role{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card p{margin:0;font-size:13px;line-height:1.4;color:var(--muted);min-width:0}
.rating{display:grid;grid-template-columns:76px 1fr;gap:3px 8px;font-size:12px;font-weight:800;align-items:center}
.pips{display:flex;gap:3px}.pips i{width:14px;height:8px;border-radius:4px;background:#e4e9f2}.pips i.on{background:var(--sun);box-shadow:inset 0 -2px 0 #e5a21c}
.skl{display:flex;flex-wrap:wrap;gap:4px}.skl span{font-size:11px;font-weight:800;background:#eef6ff;border:1.5px solid #c7dcf5;border-radius:999px;padding:1px 7px}
.play{margin-top:4px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:6px;text-align:center;box-shadow:inset 0 -3px 0 #e5a21c}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;font-weight:800;color:var(--deep)}
kbd{font-family:var(--display);background:#fff;border:2px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:0 5px;font-size:12px}
.menu{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:18px;width:min(100%,520px);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.menu h2{font-family:var(--display);margin:0;font-size:26px}
.menu table{border-collapse:collapse;font-size:13px;width:100%}
.menu td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.menu td:first-child{white-space:nowrap;font-weight:800}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:600;font-size:16px;border:3px solid var(--ink);border-radius:12px;padding:6px 16px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #d5deea}
.btn.primary{background:var(--sun);box-shadow:inset 0 -3px 0 #e5a21c}
.btn:focus-visible{outline:3px solid var(--mana);outline-offset:2px}
#touch{position:absolute;inset:0;pointer-events:none}
#touch .pad{position:absolute;bottom:15%;display:grid;gap:6px;pointer-events:auto}
#touch button{width:52px;height:52px;border-radius:50%;border:3px solid rgba(43,33,64,.7);background:rgba(255,255,255,.72);font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#touch .dpad{left:2%;grid-template-columns:repeat(3,52px)}
#touch .acts{right:2%;grid-template-columns:repeat(4,52px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
/* character creator */
#creator{justify-content:flex-start}
.cr-wrap{width:min(100%,980px);display:flex;flex-direction:column;gap:12px}
.cr-logo{font-size:clamp(28px,4.5vw,44px)}
.cr-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
@media (max-width:760px){.cr-layout{grid-template-columns:minmax(0,1fr)}}
.cr-card{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
#crStage{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:12px;display:block;background:linear-gradient(#9fdaff,#e6f7ff 70%)}
.cr-who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cr-who b{font-family:var(--display);font-size:22px}.cr-who span{color:var(--muted);font-weight:700;font-size:14px}
.cr-label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:13px}
#crNameInput{font:inherit;font-size:16px;font-weight:700;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);background:#fff}
#crNameInput:focus-visible{outline:3px solid var(--mana);outline-offset:2px}
#crErr{color:#c2334a;font-size:13px;font-weight:800;min-height:1em}
.cr-tabs{display:flex;gap:6px;flex-wrap:wrap}
.cr-tabs button{font-family:var(--display);font-weight:600;font-size:16px;padding:5px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.cr-tabs button[aria-selected="true"]{background:var(--sun);box-shadow:inset 0 -3px 0 #e5a21c}
.cr-group{display:flex;flex-direction:column;gap:6px}
.cr-group h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cr-opts{display:flex;flex-wrap:wrap;gap:6px}
.cr-opt{font:inherit;font-weight:800;font-size:13px;border:2px solid #c7dcf5;background:#eef6ff;color:var(--ink);border-radius:12px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.cr-opt canvas{width:56px;height:56px}
.cr-opt.text{flex-direction:row;padding:6px 12px;min-width:0}
.cr-opt[aria-pressed="true"],.cr-cls[aria-pressed="true"]{border-color:var(--ink);background:#fff6d6;box-shadow:inset 0 -3px 0 var(--sun)}
.cr-sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.cr-sw[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.cr-opt:focus-visible,.cr-sw:focus-visible,.cr-cls:focus-visible{outline:3px solid var(--mana);outline-offset:2px}
.cr-classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:440px){.cr-classes{grid-template-columns:1fr}}
.cr-cls{font:inherit;text-align:left;border:2px solid #c7dcf5;background:#eef6ff;border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.cr-cls b{font-family:var(--display);font-size:17px}.cr-cls small{color:var(--muted);font-weight:700;line-height:1.3}
#crDone{font-weight:800;color:var(--deep);min-height:1.2em;margin:0}
</style>

<div id="stage">
  <div id="wrap">
    <canvas id="game" aria-label="Brightvale game screen"></canvas>
    <div id="touch" hidden>
      <div class="pad dpad">
        <span></span><button data-k="up">▲</button><span></span>
        <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
      </div>
      <div class="pad acts">
        <button data-k="a">A</button><button data-k="s">S</button><button data-k="d">D</button><button data-k="f">F</button>
        <button data-k="hp">Q</button><button data-k="mp">W</button><button data-k="basic">X</button><button data-k="jump">⤒</button>
      </div>
    </div>
  </div>
  <div id="title" class="overlay">
    <div class="logo">Brightvale</div>
    <div class="sub">Pick a class and head out into Clover Hill.</div>
    <div class="cards" id="cards"></div>
    <div class="btns"><button class="btn primary" type="button" id="newCharBtn">New character</button><a class="btn" href="wardrobe.html">Wardrobe</a><a class="btn" href="skills.html">Skills</a></div>
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>↑</kbd><kbd>↓</kbd> climb ropes</span><span><kbd>Space</kbd> jump</span>
      <span><kbd>↓</kbd>+<kbd>Space</kbd> drop down</span><span><kbd>X</kbd> attack</span><span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> skills</span>
      <span><kbd>Q</kbd><kbd>W</kbd> potions</span><span><kbd>Esc</kbd> menu</span>
    </div>
  </div>
  <div id="creator" class="overlay" hidden>
    <div class="cr-wrap">
      <div class="logo cr-logo">Create your hero</div>
      <div class="cr-layout">
        <section class="cr-card" aria-label="Character preview">
          <canvas id="crStage" width="512" height="512" role="img" aria-label="Your character"></canvas>
          <div class="cr-who"><b id="crWho">Hero</b><span id="crLine"></span></div>
        </section>
        <section class="cr-card" aria-label="Character options">
          <label class="cr-label">Name<input id="crNameInput" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Pip"></label>
          <div id="crErr" role="alert"></div>
          <div class="cr-tabs" role="tablist" id="crTabs"></div>
          <div id="crBody" style="display:flex;flex-direction:column;gap:10px"></div>
          <div class="btns" style="justify-content:flex-start"><button class="btn" type="button" id="crBack">Back</button><button class="btn" type="button" id="crRand">Randomize</button><button class="btn primary" type="button" id="crCreate">Create character</button></div>
          <p id="crDone" role="status"></p>
        </section>
      </div>
    </div>
  </div>
  <div id="pause" class="overlay" hidden>
    <div class="menu" role="dialog" aria-labelledby="pauseTitle">
      <h2 id="pauseTitle">Paused</h2>
      <table id="skillTable"></table>
      <div class="btns"><button class="btn primary" id="resumeBtn">Resume</button><button class="btn" id="classBtn">Change class</button></div>
      <div style="font-size:12px;color:var(--muted)">Progress saves automatically in this browser, one save per class.</div>
    </div>
  </div>
</div>

<script src="brightvale-vfx.js"></script>
<script>
(() => {
'use strict';
const skillEffects = window.BrightvaleVFX;
const skillVfx = skillEffects?.createLayer();
/* =====================================================================
   SHARED DATA
   ===================================================================== */
const VIEW_W=960, VIEW_H=540, STEP=1/60, GRAV=1900, JUMP=720;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const sgn=v=>v<0?-1:1;

const MAP={
  name:'Clover Hill', w:3200, h:940, spawnX:230,
  platforms:[
    {x:0,y:820,w:3200,ground:true},
    {x:560,y:700,w:340},{x:1400,y:700,w:460},{x:2150,y:700,w:380},{x:2800,y:700,w:300},
    {x:960,y:580,w:300},{x:1720,y:580,w:360},{x:2560,y:580,w:300},
    {x:620,y:460,w:400},{x:1250,y:460,w:380},{x:2200,y:460,w:460},
    {x:900,y:340,w:300},{x:1800,y:340,w:420},
  ],
  ropes:[{x:680,top:460,bottom:820},{x:1330,top:460,bottom:820},{x:2720,top:580,bottom:820},
         {x:1950,top:340,bottom:580},{x:980,top:340,bottom:460},{x:2450,top:460,bottom:820}],
  portal:{x:3125,y:820},
  spawns:[
    {t:'beetle',p:0,x:650,r:[540,1380]},{t:'beetle',p:0,x:950,r:[540,1380]},{t:'beetle',p:0,x:1250,r:[540,1380]},
    {t:'beetle',p:0,x:1550,r:[1380,2080]},{t:'beetle',p:0,x:1900,r:[1380,2080]},
    {t:'boar',p:0,x:2300,r:[2120,3040]},{t:'boar',p:0,x:2650,r:[2120,3040]},{t:'boar',p:0,x:2950,r:[2120,3040]},
    {t:'beetle',p:1,x:700},{t:'beetle',p:2,x:1500},{t:'beetle',p:2,x:1750},{t:'beetle',p:3,x:2300},{t:'beetle',p:4,x:2950},
    {t:'beetle',p:5,x:1100},{t:'boar',p:6,x:1900},{t:'beetle',p:7,x:2700},
    {t:'beetle',p:8,x:820},{t:'beetle',p:9,x:1450},{t:'boar',p:10,x:2450},
    {t:'beetle',p:11,x:1050},{t:'boar',p:12,x:2000},
    {t:'wisp',x:1050,y:400},{t:'wisp',x:1500,y:380},{t:'wisp',x:2000,y:250},{t:'wisp',x:2400,y:360},{t:'wisp',x:2850,y:500},{t:'wisp',x:1650,y:640},
  ],
};

const MOB_TYPES={
  beetle:{name:'Clover Beetle',lv:2,hp:45,xp:10,touch:9,speed:45,chase:80,w:44,h:30,gold:[3,8],flying:false},
  wisp:{name:'Puff Wisp',lv:4,hp:80,xp:22,touch:12,speed:40,chase:75,w:36,h:36,gold:[6,14],flying:true,shot:14},
  boar:{name:'Bristle Boar',lv:6,hp:190,xp:48,touch:24,speed:40,chase:90,w:68,h:46,gold:[12,26],flying:false},
};

const CLASSES={
  warrior:{name:'Vanguard',role:'Sword & armor',blurb:'Tough and close-range. Wide sweeps hit whole groups.',
    base:{hp:130,mp:40,atk:15,def:4},grow:{hp:26,mp:5,atk:3,def:1},speed:220,ratings:{Toughness:5,Power:4,Range:1},
    skills:{
      basic:{name:'Slash',icon:'slash',kind:'melee',lock:.42,range:80,height:66,targets:1,hits:1,mult:1,desc:'A quick swing at the closest enemy.'},
      a:{name:'Cleave',icon:'cleave',kind:'melee',mp:6,lock:.55,range:130,height:86,targets:5,hits:2,mult:.8,desc:'A wide two-hit sweep that hits up to 5 enemies.'},
      s:{name:'Earthsplitter',icon:'slam',kind:'slam',mp:14,cd:4,lock:.7,radius:210,targets:8,mult:1.8,stun:1.6,desc:'Smash the ground to launch and stun nearby enemies.'},
      d:{name:'War Cry',icon:'cry',kind:'buff',mp:18,cd:25,lock:.5,dur:20,desc:'Attack power +35% for 20 seconds.'},
      f:{name:'Charge',icon:'charge',kind:'dash',mp:5,cd:2.5,lock:.25,dist:230,mult:.7,desc:'Rush forward and bowl over anything in the way.'},
    }},
  mage:{name:'Arcanist',role:'Spells & staff',blurb:'Fragile but hits hard from range. Freezes and chains through crowds.',
    base:{hp:80,mp:120,atk:17,def:1},grow:{hp:14,mp:16,atk:3.4,def:.5},speed:205,ratings:{Toughness:1,Power:5,Range:4},
    skills:{
      basic:{name:'Spark',icon:'spark',kind:'proj',lock:.45,speed:640,range:430,mult:.9,sprite:'spark',desc:'A small magic bolt.'},
      a:{name:'Fire Orb',icon:'fire',kind:'proj',mp:8,lock:.55,speed:440,range:480,mult:2,splash:85,sprite:'fire',desc:'A fireball that bursts on impact and splashes nearby enemies.'},
      s:{name:'Chain Lightning',icon:'chain',kind:'chain',mp:14,cd:1,lock:.6,range:420,jumps:4,jumpRange:230,mult:1.6,desc:'Lightning that leaps between up to 4 enemies.'},
      d:{name:'Frost Nova',icon:'nova',kind:'nova',mp:22,cd:7,lock:.6,radius:175,mult:1.3,freeze:3,desc:'Freeze everything around you for 3 seconds.'},
      f:{name:'Blink',icon:'blink',kind:'blink',mp:6,cd:1.5,lock:.15,dist:210,desc:'Teleport a short distance forward, even mid-air.'},
    }},
  archer:{name:'Ranger',role:'Bow & arrows',blurb:'Fast and nimble, with the longest double jump. Picks enemies off from far away.',
    base:{hp:100,mp:70,atk:14,def:2},grow:{hp:19,mp:9,atk:3,def:.8},speed:240,doubleJump:true,ratings:{Toughness:3,Power:3,Range:5},
    skills:{
      basic:{name:'Quick Shot',icon:'arrow',kind:'proj',lock:.38,speed:980,range:540,mult:.95,sprite:'arrow',desc:'Fire a single arrow.'},
      a:{name:'Twin Shot',icon:'twin',kind:'proj',mp:5,lock:.5,count:2,speed:980,range:540,mult:1,sprite:'arrow',desc:'Fire two arrows at once.'},
      s:{name:'Piercing Arrow',icon:'pierce',kind:'proj',mp:12,cd:1.2,lock:.6,speed:1150,range:720,mult:2.2,pierce:true,sprite:'bigarrow',desc:'A heavy arrow that passes through every enemy in a line.'},
      d:{name:'Arrow Storm',icon:'rain',kind:'rain',mp:24,cd:9,lock:.6,width:270,dur:2.4,tick:.3,mult:.75,desc:'Rain arrows on the area ahead for 2.4 seconds.'},
      f:{name:'Vault',icon:'vault',kind:'vault',mp:5,cd:2,lock:.3,mult:1.3,desc:'Flip backward out of danger while firing an arrow.'},
    }},
};
const SKILL_KEYS=['basic','a','s','d','f'];
const KEY_LABEL={basic:'X',a:'A',s:'S',d:'D',f:'F'};
const xpNeed=lv=>Math.round(18*Math.pow(lv,1.5)+12);

/* =====================================================================
   SIMULATION — the game rules. No drawing here. Input arrives only as
   actions, and results leave only as events, so this block can later
   run on a server for multiplayer.
   ===================================================================== */
function createWorld(){
  const w={time:0,players:{},mobs:[],proj:[],eproj:[],zones:[],drops:[],actions:[],events:[],nextId:1};
  MAP.spawns.forEach(sp=>w.mobs.push(makeMob(w,w.nextId++,sp)));
  return w;
}
const emit=(w,e)=>w.events.push(e);
function dispatch(w,pid,action){ w.actions.push(Object.assign({pid},action)); }

function makeMob(w,id,sp){
  const T=MOB_TYPES[sp.t];
  const m={id,sp,type:sp.t,dead:false,hp:T.hp,maxHp:T.hp,dir:Math.random()<.5?-1:1,state:'patrol',stateT:rand(.5,2),
    z:0,vz:0,kb:0,hitT:0,showBar:0,stun:0,freeze:0,aggro:null,aggroT:0,shootT:rand(1,2.5),phase:rand(0,10),seed:rand(0,6.28),
    walking:false,moving:false,born:w.time,respawnT:0};
  if(T.flying){ m.x=m.hx=sp.x; m.y=m.hy=sp.y; m.minX=sp.x-360; m.maxX=sp.x+360; }
  else { const pl=MAP.platforms[sp.p]; m.x=sp.x; m.y=pl.y; const r=sp.r||[pl.x+20,pl.x+pl.w-20]; m.minX=r[0]; m.maxX=r[1]; }
  return m;
}

function recalc(p){
  const C=CLASSES[p.cls], L=p.level-1;
  p.maxHp=Math.round(C.base.hp+C.grow.hp*L); p.maxMp=Math.round(C.base.mp+C.grow.mp*L);
  p.atk=C.base.atk+C.grow.atk*L; p.def=Math.floor(C.base.def+C.grow.def*L);
}
function addPlayer(w,id,d){
  const p={id,cls:d.cls,name:d.name||null,look:d.look||null,level:d.level||1,xp:d.xp||0,gold:d.gold||0,hpPot:d.hpPot??5,mpPot:d.mpPot??5,
    x:MAP.spawnX,y:MAP.platforms[0].y,vx:0,vy:0,facing:1,onGround:true,plat:0,rope:null,dropPlat:-1,dropT:0,ropeCd:0,
    input:{left:false,right:false,up:false,down:false,skill:null},act:null,actT:0,actDur:1,cds:{},buffs:{},
    invuln:1,ctrlLock:0,usedDouble:false,dead:false,deadT:0,regenT:0,potCd:0,dashT:0,dashV:0,warnT:0,climbPh:0,portalT:0};
  recalc(p); p.hp=p.maxHp; p.mp=p.maxMp;
  w.players[id]=p; return p;
}

function platAt(x,y){ return MAP.platforms.findIndex(pl=>Math.abs(pl.y-y)<2&&x>=pl.x-2&&x<=pl.x+pl.w+2); }
function floorBelow(x,y){ let best=MAP.platforms[0].y; for(const pl of MAP.platforms){ if(x>=pl.x&&x<=pl.x+pl.w&&pl.y>=y-1&&pl.y<best) best=pl.y; } return best; }
const pBox=p=>({x0:p.x-12,x1:p.x+12,y0:p.y-52,y1:p.y});
function mobBox(m){ const T=MOB_TYPES[m.type];
  return T.flying?{x0:m.x-T.w/2,x1:m.x+T.w/2,y0:m.y-T.h/2,y1:m.y+T.h/2}:{x0:m.x-T.w/2,x1:m.x+T.w/2,y0:m.y-m.z-T.h,y1:m.y-m.z}; }
const mobCenter=m=>{const b=mobBox(m);return{x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2};};
const overlap=(a,b)=>a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0;
const liveMobs=w=>w.mobs.filter(m=>!m.dead);

function stepWorld(w,dt){
  w.time+=dt;
  for(const a of w.actions) handleAction(w,a);
  w.actions.length=0;
  for(const id in w.players) updatePlayer(w,w.players[id],dt);
  for(const m of w.mobs) updateMob(w,m,dt);
  updateProjectiles(w,dt); updateZones(w,dt); updateDrops(w,dt);
}

function handleAction(w,a){
  const p=w.players[a.pid]; if(!p) return;
  if(a.type==='input') p.input=a.input;
  else if(a.type==='jump') tryJump(w,p);
  else if(a.type==='potion') usePotion(w,p,a.kind);
}

function tryJump(w,p){
  if(p.dead) return;
  if(p.rope){
    const dir=(p.input.right?1:0)-(p.input.left?1:0);
    if(dir){ p.rope=null; p.vx=dir*210; p.vy=-430; p.ropeCd=.35; p.facing=dir; emit(w,{type:'jump',pid:p.id}); }
    return;
  }
  if(p.onGround){
    if(p.input.down&&!MAP.platforms[p.plat].ground){ p.dropPlat=p.plat; p.dropT=.3; p.onGround=false; p.vy=80; return; }
    p.vy=-JUMP; p.onGround=false; emit(w,{type:'jump',pid:p.id});
  } else if(!p.usedDouble&&p.dashT<=0){
    // Double jump for every class: a quick forward burst with a little lift.
    // Holding left/right picks the direction; the Ranger's goes farther and higher.
    const long=CLASSES[p.cls].doubleJump, dir=((p.input.right?1:0)-(p.input.left?1:0))||p.facing;
    p.facing=dir; p.usedDouble=true;
    p.vy=-JUMP*(long?.7:.55); p.vx=dir*(long?500:420); p.ctrlLock=.25;
    emit(w,{type:'djump',pid:p.id,x:p.x,y:p.y,facing:dir});
  }
}

function usePotion(w,p,kind){
  if(p.dead||p.potCd>0) return;
  const key=kind==='hp'?'hpPot':'mpPot', max=kind==='hp'?p.maxHp:p.maxMp, cur=kind==='hp'?p.hp:p.mp;
  if(p[key]<=0){ emit(w,{type:'msg',pid:p.id,text:`Out of ${kind.toUpperCase()} potions`}); p.potCd=.6; return; }
  if(cur>=max) return;
  p[key]--; p.potCd=.4;
  if(kind==='hp') p.hp=Math.min(max,p.hp+max*.45); else p.mp=Math.min(max,p.mp+max*.45);
  emit(w,{type:'potion',pid:p.id,kind});
}

function updatePlayer(w,p,dt){
  if(p.dead){
    p.deadT-=dt;
    if(p.deadT<=0){ p.dead=false; p.hp=Math.round(p.maxHp*.5); p.mp=Math.round(p.maxMp*.5); p.x=MAP.spawnX; p.y=MAP.platforms[0].y;
      p.vx=p.vy=0; p.invuln=2; p.rope=null; p.onGround=true; p.plat=0; emit(w,{type:'respawn',pid:p.id}); }
    return;
  }
  for(const k in p.cds) p.cds[k]=Math.max(0,p.cds[k]-dt);
  for(const k in p.buffs){ p.buffs[k]-=dt; if(p.buffs[k]<=0){ delete p.buffs[k]; emit(w,{type:'log',pid:p.id,text:'War Cry wore off'}); } }
  p.invuln=Math.max(0,p.invuln-dt); p.ctrlLock=Math.max(0,p.ctrlLock-dt); p.dropT=Math.max(0,p.dropT-dt);
  p.potCd=Math.max(0,p.potCd-dt); p.actT=Math.max(0,p.actT-dt); p.ropeCd=Math.max(0,p.ropeCd-dt); p.warnT=Math.max(0,p.warnT-dt);
  p.regenT+=dt;
  if(p.regenT>=1){ p.regenT-=1; p.hp=Math.min(p.maxHp,p.hp+Math.max(1,p.maxHp*.01)); p.mp=Math.min(p.maxMp,p.mp+1+p.maxMp*.025); }

  const inp=p.input;
  if(inp.skill&&p.actT<=0) tryCast(w,p,inp.skill);

  // ---- ropes
  if(p.rope){
    const r=p.rope, dc=(inp.down?1:0)-(inp.up?1:0);
    p.vx=0; p.vy=dc*170; p.x=r.x; p.y+=p.vy*dt; p.climbPh+=Math.abs(dc)*dt;
    if(p.y<=r.top){ p.y=r.top; p.rope=null; p.vy=0; p.onGround=true; p.plat=platAt(r.x,r.top); p.ropeCd=.25; }
    else if(p.y>=r.bottom){ p.y=r.bottom; p.rope=null; p.vy=0; const pi=platAt(r.x,r.bottom); p.onGround=pi>=0; p.plat=Math.max(0,pi); p.ropeCd=.25; }
    return;
  }
  if(p.ropeCd<=0&&p.actT<=0&&p.dashT<=0){
    for(const r of MAP.ropes){
      if(Math.abs(p.x-r.x)>=14) continue;
      const up=inp.up&&p.y>r.top+6&&p.y<=r.bottom+2;
      const down=inp.down&&p.onGround&&Math.abs(p.y-r.top)<2;
      if(up||down){ p.rope=r; p.x=r.x; p.vx=p.vy=0; p.onGround=false; p.usedDouble=false; if(down) p.y=r.top+8; return; }
    }
  }

  // ---- walking / air control
  const C=CLASSES[p.cls], dir=(inp.right?1:0)-(inp.left?1:0);
  if(p.dashT>0){ p.dashT-=dt; p.vx=p.dashV; if(p.dashT<=0) p.vx=p.dashV*.2; }
  else if(p.ctrlLock>0){ p.vx=approach(p.vx,0,220*dt); }
  else{
    const planted=p.onGround&&p.actT>0;
    if(dir&&p.actT<=0) p.facing=dir;
    p.vx=approach(p.vx,planted?0:dir*C.speed,(p.onGround?2600:1150)*dt);
  }
  if(p.dashT>0) p.vy=0; else p.vy=Math.min(p.vy+GRAV*dt,980);

  const oy=p.y; let ny=p.y+p.vy*dt;
  p.x=clamp(p.x+p.vx*dt,14,MAP.w-14);
  p.onGround=false;
  if(p.vy>=0){
    let best=-1,by=Infinity;
    MAP.platforms.forEach((pl,i)=>{
      if(i===p.dropPlat&&p.dropT>0) return;
      if(p.x<pl.x-2||p.x>pl.x+pl.w+2) return;
      if(oy<=pl.y+.5&&ny>=pl.y&&pl.y<by){ by=pl.y; best=i; }
    });
    if(best>=0){ ny=by; p.vy=0; p.onGround=true; p.plat=best; p.usedDouble=false; }
  }
  p.y=ny;

  if(inp.up&&p.onGround&&Math.abs(p.x-MAP.portal.x)<44&&w.time>p.portalT){
    p.portalT=w.time+3; emit(w,{type:'msg',pid:p.id,text:'This portal opens in a future update'});
  }
}

function tryCast(w,p,key){
  const sk=CLASSES[p.cls].skills[key];
  if(!sk||p.rope||p.dead) return;
  if((p.cds[key]||0)>0) return;
  const cost=sk.mp||0;
  if(p.mp<cost){ if(p.warnT<=0){ emit(w,{type:'msg',pid:p.id,text:'Not enough MP'}); p.warnT=1.2; } return; }
  p.mp-=cost; if(sk.cd) p.cds[key]=sk.cd;
  p.act=key; p.actDur=sk.lock; p.actT=sk.lock;
  KINDS[sk.kind](w,p,sk,key);
  emit(w,{type:'cast',pid:p.id,key,kind:sk.kind,cls:p.cls,x:p.x,y:p.y,facing:p.facing});
}

function hitMob(w,p,m,mult,o={}){
  if(m.dead) return;
  let dmg=p.atk*(p.buffs.warcry?1.35:1)*mult*rand(.85,1.15);
  const crit=Math.random()<.12; if(crit) dmg*=1.6;
  dmg=Math.max(1,Math.round(dmg));
  m.hp-=dmg; m.hitT=.16; m.showBar=5; m.aggro=p.id; m.aggroT=9;
  if(m.state==='patrol') m.state='chase';
  if(o.kb&&!(m.type==='boar'&&m.state==='charge')) m.kb=(o.dir||sgn(m.x-p.x))*o.kb;
  const c=mobCenter(m);
  emit(w,{type:'dmg',who:'mob',x:c.x,y:mobBox(m).y0,n:dmg,crit,stack:o.stack||0,pid:p.id});
  if(m.hp<=0) killMob(w,m,p);
}

function killMob(w,m,p){
  const T=MOB_TYPES[m.type]; m.dead=true; m.respawnT=8;
  const c=mobCenter(m);
  emit(w,{type:'kill',mob:m.type,x:c.x,y:c.y,dir:m.dir});
  const fy=T.flying?floorBelow(m.x,m.y):m.y;
  const drop=(kind,amount)=>w.drops.push({id:w.nextId++,kind,amount,x:m.x+rand(-10,10),y:c.y,floor:fy,vx:rand(-60,60),vy:-380,landed:false,life:40,age:0});
  drop('gold',Math.round(rand(T.gold[0],T.gold[1])));
  if(Math.random()<.28) drop('hp',1);
  if(Math.random()<.24) drop('mp',1);
  gainXp(w,p,T.xp);
}

function gainXp(w,p,n){
  p.xp+=n; emit(w,{type:'log',pid:p.id,text:`+${n} EXP`});
  while(p.xp>=xpNeed(p.level)){
    p.xp-=xpNeed(p.level); p.level++; recalc(p); p.hp=p.maxHp; p.mp=p.maxMp;
    emit(w,{type:'levelup',pid:p.id,level:p.level});
  }
}

function hurtPlayer(w,p,raw,dir){
  if(p.dead||p.invuln>0) return;
  const dmg=Math.max(1,Math.round(raw*rand(.9,1.1)-p.def));
  p.hp-=dmg; p.invuln=1.3; p.dashT=0; p.rope=null;
  p.vx=dir*260; p.vy=-320; p.ctrlLock=.3; p.onGround=false;
  emit(w,{type:'dmg',who:'player',x:p.x,y:p.y-60,n:dmg,crit:false,stack:0,pid:p.id});
  if(p.hp<=0){
    p.hp=0; p.dead=true; p.deadT=3; p.vx=0;
    p.xp=Math.max(0,p.xp-Math.round(xpNeed(p.level)*.05));
    emit(w,{type:'death',pid:p.id});
  }
}

const KINDS={
  melee(w,p,sk){
    const f=p.facing, b={x0:f>0?p.x-12:p.x-sk.range,x1:f>0?p.x+sk.range:p.x+12,y0:p.y-sk.height,y1:p.y+6};
    liveMobs(w).filter(m=>overlap(mobBox(m),b)).sort((a,c)=>Math.abs(a.x-p.x)-Math.abs(c.x-p.x)).slice(0,sk.targets)
      .forEach(m=>{ for(let h=0;h<sk.hits;h++) hitMob(w,p,m,sk.mult,{stack:h,kb:110,dir:f}); });
  },
  slam(w,p,sk){
    liveMobs(w).filter(m=>{ const T=MOB_TYPES[m.type];
      return Math.abs(m.x-p.x)<=sk.radius&&(T.flying?Math.abs(m.y-(p.y-30))<110:Math.abs(m.y-p.y)<40); })
      .slice(0,sk.targets).forEach(m=>{ hitMob(w,p,m,sk.mult,{}); if(!m.dead){ m.stun=sk.stun; if(!MOB_TYPES[m.type].flying) m.vz=430; } });
  },
  buff(w,p,sk){ p.buffs.warcry=sk.dur; emit(w,{type:'log',pid:p.id,text:'War Cry: attack +35%'}); },
  dash(w,p,sk){
    const end=clamp(p.x+p.facing*sk.dist,14,MAP.w-14);
    p.dashT=.18; p.dashV=(end-p.x)/.18; p.invuln=Math.max(p.invuln,.35);
    const b={x0:Math.min(p.x,end)-20,x1:Math.max(p.x,end)+20,y0:p.y-60,y1:p.y+6};
    liveMobs(w).filter(m=>overlap(mobBox(m),b)).forEach(m=>{ hitMob(w,p,m,sk.mult,{kb:260,dir:p.facing}); if(!m.dead) m.stun=Math.max(m.stun,.5); });
  },
  proj(w,p,sk){
    const n=sk.count||1, mage=p.cls==='mage';
    for(let i=0;i<n;i++){
      w.proj.push({x:p.x+p.facing*18,y:p.y-(mage?38:30)+(n>1?(i-.5)*14:0),vx:p.facing*sk.speed,owner:p.id,mult:sk.mult,
        pierce:!!sk.pierce,splash:sk.splash||0,range:sk.range,dist:0,hit:new Set(),sprite:sk.sprite,done:false});
    }
  },
  chain(w,p,sk){
    const pts=[{x:p.x+p.facing*16,y:p.y-40}], hitSet=new Set();
    const cands=liveMobs(w).filter(m=>{ const c=mobCenter(m), dx=c.x-p.x; return Math.abs(dx)<=sk.range&&dx*p.facing>-30&&Math.abs(c.y-(p.y-30))<200; })
      .sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));
    let cur=cands[0];
    for(let j=0;j<sk.jumps&&cur;j++){
      const c=mobCenter(cur); pts.push(c); hitSet.add(cur.id);
      hitMob(w,p,cur,sk.mult*(j?.85:1),{});
      let next=null,bd=sk.jumpRange;
      for(const m of liveMobs(w)){ if(hitSet.has(m.id)) continue; const mc=mobCenter(m), d=Math.hypot(mc.x-c.x,mc.y-c.y); if(d<bd){bd=d;next=m;} }
      cur=next;
    }
    if(pts.length===1) pts.push({x:p.x+p.facing*170,y:p.y-40});
    emit(w,{type:'bolt',pts});
  },
  nova(w,p,sk){
    const cx=p.x, cy=p.y-28;
    liveMobs(w).forEach(m=>{ const c=mobCenter(m); if(Math.hypot(c.x-cx,c.y-cy)<=sk.radius){ hitMob(w,p,m,sk.mult,{}); if(!m.dead) m.freeze=sk.freeze; } });
  },
  blink(w,p,sk){
    const ox=p.x; p.x=clamp(p.x+p.facing*sk.dist,14,MAP.w-14); p.vy=Math.min(p.vy,0); p.invuln=Math.max(p.invuln,.2);
    emit(w,{type:'blink',pid:p.id,from:ox,to:p.x,y:p.y});
  },
  vault(w,p,sk){
    p.vy=-540; p.vx=-p.facing*320; p.ctrlLock=.4; p.onGround=false; p.invuln=Math.max(p.invuln,.45);
    w.proj.push({x:p.x+p.facing*18,y:p.y-30,vx:p.facing*1000,owner:p.id,mult:sk.mult,pierce:false,splash:0,range:540,dist:0,hit:new Set(),sprite:'arrow',done:false});
  },
  rain(w,p,sk){
    w.zones.push({owner:p.id,x:p.x+p.facing*175,y:p.y,half:sk.width/2,t:sk.dur,dur:sk.dur,tickT:.15,tick:sk.tick,mult:sk.mult,seed:Math.random()*1000});
  },
};

function updateMob(w,m,dt){
  if(m.dead){ m.respawnT-=dt; if(m.respawnT<=0){ Object.assign(m,makeMob(w,m.id,m.sp)); } return; }
  const T=MOB_TYPES[m.type];
  m.hitT=Math.max(0,m.hitT-dt); m.showBar=Math.max(0,m.showBar-dt); m.stun=Math.max(0,m.stun-dt); m.freeze=Math.max(0,m.freeze-dt);
  m.aggroT=Math.max(0,m.aggroT-dt); m.phase+=dt;
  if(m.aggroT<=0&&m.aggro){ m.aggro=null; m.state='patrol'; }
  if(!T.flying&&(m.z>0||m.vz!==0)){ m.vz-=GRAV*dt; m.z+=m.vz*dt; if(m.z<=0){ m.z=0; m.vz=0; } }
  if(m.kb){ m.x+=m.kb*dt; m.kb=approach(m.kb,0,700*dt); }
  m.moving=false;
  if(m.freeze>0||m.stun>0){ m.x=clamp(m.x,m.minX,m.maxX); return; }
  let target=m.aggro?w.players[m.aggro]:null;
  if(target&&target.dead) target=null;

  if(T.flying){
    if(target){
      const dx=target.x-m.x, dy=(target.y-34)-m.y, d=Math.hypot(dx,dy)||1;
      if(d>150){ m.x+=dx/d*T.chase*dt; m.y+=dy/d*T.chase*.6*dt; }
      m.dir=sgn(dx);
      m.shootT-=dt;
      if(m.shootT<=0&&d<460){ m.shootT=2.6; w.eproj.push({x:m.x,y:m.y,vx:dx/d*240,vy:dy/d*240,dmg:T.shot,life:3}); emit(w,{type:'shoot',x:m.x,y:m.y}); }
      const hd=Math.hypot(m.x-m.hx,m.y-m.hy); if(hd>340){ m.x=lerp(m.x,m.hx,.02); m.y=lerp(m.y,m.hy,.02); }
    } else {
      const tx=m.hx+Math.sin(m.phase*.45+m.seed)*130, ty=m.hy+Math.sin(m.phase*.9+m.seed)*28;
      m.dir=sgn(tx-m.x)||m.dir; m.x=approach(m.x,tx,T.speed*dt); m.y=approach(m.y,ty,T.speed*.6*dt);
    }
    m.y=Math.min(m.y,MAP.platforms[0].y-40);
    m.moving=true;
  } else {
    let speed=0;
    const same=target&&Math.abs(target.y-m.y)<30;
    if(m.type==='boar'&&target){
      if(m.state==='windup'){ m.stateT-=dt; if(m.stateT<=0){ m.state='charge'; m.stateT=.9; } }
      else if(m.state==='charge'){ speed=310; m.stateT-=dt; if(m.stateT<=0){ m.state='rest'; m.stateT=1.2; } }
      else if(m.state==='rest'){ m.stateT-=dt; if(m.stateT<=0) m.state='chase'; }
      else { m.state='chase'; const dx=target.x-m.x; m.dir=sgn(dx); speed=T.chase;
        if(same&&Math.abs(dx)<320&&Math.abs(dx)>40){ m.state='windup'; m.stateT=.45; speed=0; } }
    } else if(target&&same){
      const dx=target.x-m.x; m.dir=sgn(dx); speed=Math.abs(dx)>10?T.chase:0;
    } else {
      m.stateT-=dt;
      if(m.stateT<=0){ m.walking=Math.random()<.65; m.dir=Math.random()<.5?-1:1; m.stateT=rand(1.2,3); }
      speed=m.walking?T.speed:0;
    }
    m.x+=m.dir*speed*dt; m.moving=speed>0;
    if(m.x<m.minX){ m.x=m.minX; m.dir=1; if(m.state==='charge'){ m.state='rest'; m.stateT=1.2; } }
    if(m.x>m.maxX){ m.x=m.maxX; m.dir=-1; if(m.state==='charge'){ m.state='rest'; m.stateT=1.2; } }
  }
  m.x=clamp(m.x,m.minX,m.maxX);
  const b=mobBox(m);
  for(const id in w.players){ const p=w.players[id]; if(!p.dead&&p.invuln<=0&&overlap(pBox(p),b)) hurtPlayer(w,p,T.touch*(m.state==='charge'?1.3:1),sgn(p.x-m.x)); }
}

function updateProjectiles(w,dt){
  for(const pr of w.proj){
    const step=pr.vx*dt; pr.x+=step; pr.dist+=Math.abs(step);
    const owner=w.players[pr.owner];
    if(owner){
      const pb={x0:Math.min(pr.x,pr.x-step)-4,x1:Math.max(pr.x,pr.x-step)+4,y0:pr.y-15,y1:pr.y+15};
      for(const m of w.mobs){
        if(m.dead||pr.hit.has(m.id)) continue;
        if(!overlap(pb,mobBox(m))) continue;
        pr.hit.add(m.id);
        hitMob(w,owner,m,pr.mult,{kb:pr.pierce?60:90,dir:sgn(pr.vx)});
        if(pr.splash){
          const c=mobCenter(m);
          emit(w,{type:'explode',x:c.x,y:c.y,r:pr.splash});
          liveMobs(w).forEach(o=>{ if(o!==m){ const oc=mobCenter(o); if(Math.hypot(oc.x-c.x,oc.y-c.y)<pr.splash) hitMob(w,owner,o,pr.mult*.6,{}); } });
        }
        if(!pr.pierce){ pr.done=true; break; }
      }
    }
    if(pr.dist>pr.range||pr.x<0||pr.x>MAP.w) pr.done=true;
  }
  w.proj=w.proj.filter(p=>!p.done);
  for(const e of w.eproj){
    e.x+=e.vx*dt; e.y+=e.vy*dt; e.life-=dt;
    for(const id in w.players){ const p=w.players[id];
      if(!p.dead&&overlap(pBox(p),{x0:e.x-6,x1:e.x+6,y0:e.y-6,y1:e.y+6})){ if(p.invuln<=0) hurtPlayer(w,p,e.dmg,sgn(e.vx)); e.life=0; } }
  }
  w.eproj=w.eproj.filter(e=>e.life>0);
}

function updateZones(w,dt){
  for(const z of w.zones){
    z.t-=dt; z.tickT-=dt;
    const owner=w.players[z.owner];
    if(z.tickT<=0&&owner){
      z.tickT+=z.tick;
      const b={x0:z.x-z.half,x1:z.x+z.half,y0:z.y-320,y1:z.y+10};
      liveMobs(w).filter(m=>overlap(mobBox(m),b)).slice(0,6).forEach(m=>hitMob(w,owner,m,z.mult,{}));
    }
  }
  w.zones=w.zones.filter(z=>z.t>0);
}

function updateDrops(w,dt){
  for(const d of w.drops){
    d.age+=dt; d.life-=dt;
    if(!d.landed){ d.vy+=GRAV*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; if(d.vy>0&&d.y>=d.floor){ d.y=d.floor; d.landed=true; } }
    if(d.age<.35) continue;
    for(const id in w.players){ const p=w.players[id];
      if(p.dead||Math.abs(p.x-d.x)>28||Math.abs(p.y-d.y)>40) continue;
      if(d.kind==='gold'){ p.gold+=d.amount; emit(w,{type:'log',pid:p.id,text:`+${d.amount} gold`}); }
      else if(d.kind==='hp'){ p.hpPot++; emit(w,{type:'log',pid:p.id,text:'Picked up an HP potion'}); }
      else { p.mpPot++; emit(w,{type:'log',pid:p.id,text:'Picked up an MP potion'}); }
      emit(w,{type:'pickup',x:d.x,y:d.y,kind:d.kind}); d.life=0; break;
    }
  }
  w.drops=w.drops.filter(d=>d.life>0);
}

// ---------- event handling (sim → visuals)
function drainEvents(){
  for(const e of world.events){
    skillVfx?.event(e);
    const mine=e.pid===ME;
    switch(e.type){
      case 'dmg':
        numbers.push({x:e.x+rand(-4,4),y:e.y,n:e.n,crit:e.crit,who:e.who,t:-e.stack*.08,stack:e.stack});
        if(e.who==='mob'&&spriteFx('hit',{x:e.x,y:e.y+14,dur:.3,facing:Math.random()<.5?-1:1})){ if(e.crit) shake=Math.max(shake,4); }
        else if(e.who==='mob'){ burst(e.x,e.y+12,e.crit?10:6,['#fff7c2','#ffd34d','#ffffff'],e.crit?260:180); if(e.crit) shake=Math.max(shake,4); }
        else shake=Math.max(shake,6);
        break;
      case 'kill': effects.push({k:'poof',x:e.x,y:e.y,t:0,d:.6,mob:e.mob}); burst(e.x,e.y,14,mobColors(e.mob),240); break;
      case 'cast': castFx(e); break;
      case 'bolt': e.pts.slice(1).forEach(q=>spriteFx('shock',{x:q.x,y:q.y,dur:.35})); if(e.pts.length>2) screenFlash(.2,'#e6f2ff'); effects.push({k:'bolt',pts:e.pts,t:0,d:.32,seed:Math.random()*100}); shake=Math.max(shake,3); break;
      case 'explode': if(spriteFx('fireburst',{x:e.x,y:e.y,dur:.45})){ shake=Math.max(shake,6); screenFlash(.18,'#ffe2b8'); break; } effects.push({k:'explode',x:e.x,y:e.y,r:e.r,t:0,d:.45}); burst(e.x,e.y,18,['#ffe27a','#ff9f43','#ff6b3d'],320); shake=Math.max(shake,5); break;
      case 'blink': if(spriteFx('blink',{x:e.from,y:e.y-28,dur:.45})){ spriteFx('blink',{x:e.to,y:e.y-28,dur:.45}); break; } effects.push({k:'blink',x:e.from,y:e.y,t:0,d:.45},{k:'blink',x:e.to,y:e.y,t:0,d:.45}); burst(e.to,e.y-28,10,['#d9b8ff','#ffffff','#9d7bff'],160); break;
      case 'djump': djumpAt[e.pid]=clock;
        if(spriteFx('doublejump',{x:e.x,y:e.y,dur:.4,facing:e.facing||1})){ spriteFx('charge',{pid:e.pid,ox:-30,oy:-28,facing:e.facing||1,dur:.3}); break; }
        effects.push({k:'ring',x:e.x,y:e.y,t:0,d:.35,c:'#ffffff'});
        if(!spriteFx('charge',{pid:e.pid,ox:-30,oy:-28,facing:e.facing||1,dur:.3})) effects.push({k:'dash',pid:e.pid,x:e.x,y:e.y,t:0,d:.3,facing:e.facing||1});
        break;
      case 'levelup': if(mine){ effects.push({k:'level',pid:e.pid,t:0,d:2.2}); toast(`Level ${e.level}!`,'big'); logs.push({text:`You reached level ${e.level}`,t:0}); writeSave(); } break;
      case 'log': if(mine) logs.push({text:e.text,t:0}); break;
      case 'msg': if(mine) toast(e.text); break;
      case 'pickup': effects.push({k:'sparkle',x:e.x,y:e.y-10,t:0,d:.4}); break;
      case 'potion': if(mine){ const p=me(); burst(p.x,p.y-30,10,e.kind==='hp'?['#ff7a8a','#ffd0d6']:['#7cc0ff','#d6ecff'],120); } break;
      case 'death': if(mine){ toast('You were knocked out','big'); shake=10; } break;
      case 'respawn': if(mine) toast('Back at camp. Rested and ready.'); break;
    }
  }
  world.events.length=0;
  if(logs.length>6) logs.splice(0,logs.length-6);
}
function castFx(e){
  skillVfx?.cast(e);
  const sk=CLASSES[e.cls].skills[e.key];
  const f=e.facing;
  if(e.kind==='melee'&&spriteFx(e.key==='a'?'cleave':'slash',{pid:e.pid,ox:e.key==='a'?56:40,oy:-32,facing:f,dur:e.key==='a'?.36:.28})) return;
  if(e.kind==='slam'&&spriteFx('earthsplitter',{x:e.x,y:e.y,dur:.6})){ shake=Math.max(shake,11); screenFlash(.28,'#fff3d6'); return; }
  if(e.kind==='buff'&&spriteFx('warcry',{pid:e.pid,oy:-30,dur:.8})){ screenFlash(.22,'#ffd9a0'); shake=Math.max(shake,4); return; }
  if(e.kind==='dash'&&spriteFx('charge',{pid:e.pid,ox:-36,oy:-28,facing:f,dur:.35})) return;
  if(e.kind==='nova'&&spriteFx('frostnova',{x:e.x,y:e.y-28,dur:.55})){ screenFlash(.3,'#e3f7ff'); shake=Math.max(shake,5); return; }
  if(e.kind==='vault'&&spriteFx('dust',{x:e.x,y:e.y,dur:.4,facing:f})) return;
  if(e.kind==='melee') effects.push({k:'slash',pid:e.pid,t:0,d:.28,r:sk.range*.75,wide:e.key==='a',facing:e.facing});
  else if(e.kind==='slam'){ effects.push({k:'slam',x:e.x,y:e.y,t:0,d:.6,r:sk.radius}); shake=Math.max(shake,9); burst(e.x,e.y,22,['#c98a4f','#8f5a2f','#f3d29b'],360,true); }
  else if(e.kind==='buff') effects.push({k:'cry',pid:e.pid,t:0,d:.8});
  else if(e.kind==='dash') effects.push({k:'dash',pid:e.pid,x:e.x,y:e.y,t:0,d:.35,facing:e.facing});
  else if(e.kind==='nova'){ effects.push({k:'nova',x:e.x,y:e.y-28,t:0,d:.55,r:sk.radius}); burst(e.x,e.y-28,20,['#e8f7ff','#9fdcff','#ffffff'],300); }
  else if(e.kind==='vault') burst(e.x,e.y,8,['#f1e3c6','#ffffff'],120,true);
}
function burst(x,y,n,cols,sp,ground){
  for(let i=0;i<n;i++){ const a=ground?rand(-Math.PI,0):rand(0,Math.PI*2), v=rand(sp*.3,sp);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(ground?100:40),life:rand(.35,.7),max:.7,c:cols[i%cols.length],s:rand(2.5,5.5),g:ground?900:380}); }
}
function toast(text,size){ toasts.push({text,t:0,big:size==='big'}); if(toasts.length>3) toasts.shift(); }
const mobColors=t=>t==='beetle'?['#7bd35a','#ffe066','#ffffff']:t==='wisp'?['#ffffff','#c9ecff','#ffd6f0']:['#c98a5a','#ffffff','#ffcf9e'];

/* ---------- drawing helpers */
const OUT='#3a2a33';
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function ell(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); }
function fs(c,fill,lw=2.2){ c.fillStyle=fill; c.fill(); c.lineWidth=lw; c.strokeStyle=OUT; c.stroke(); }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- static scenery, generated once */
const SCN=(()=>{
  const r=rng(7);
  const clouds=[...Array(14)].map(()=>({x:r()*2400,y:30+r()*170,s:.6+r()*.9,sp:4+r()*8}));
  const hillsFar=[...Array(30)].map((_,i)=>({x:i*150+r()*60,rw:120+r()*110,h:70+r()*80}));
  const treesMid=[...Array(36)].map((_,i)=>({x:i*110+r()*60,h:90+r()*70,s:.8+r()*.5,k:r()}));
  const decor=MAP.platforms.map((pl,i)=>{ const q=rng(100+i); const n=Math.floor(pl.w/38);
    return{tufts:[...Array(n)].map(()=>({x:pl.x+8+q()*(pl.w-16),h:4+q()*6})),
      flowers:[...Array(Math.floor(n/2.5))].map(()=>({x:pl.x+14+q()*(pl.w-28),c:['#ff6b8b','#ffd23f','#ffffff','#b48cff'][Math.floor(q()*4)]})),
      vines:pl.ground?[]:[...Array(Math.max(1,Math.floor(pl.w/120)))].map(()=>({x:pl.x+20+q()*(pl.w-40),len:10+q()*26}))}; });
  const bigTrees=[{x:40,s:1.1},{x:520,s:1},{x:1180,s:1.25},{x:1640,s:.95},{x:2120,s:1.15},{x:2620,s:1.05},{x:3080,s:1.2}];
  const motes=[...Array(40)].map(()=>({x:r()*MAP.w,y:250+r()*560,ph:r()*6.28}));
  return{clouds,hillsFar,treesMid,decor,bigTrees,motes};
})();

/* ---------- map art (art/bg-*.png, art/tile-*.png); anything missing falls back to the code-drawn scenery */
const SCENE={};
function loadScenery(){
  const load=(key,src,fn)=>{ const img=new Image(); img.onload=()=>{ SCENE[key]=fn?fn(img):img; }; img.src=src; };
  ['sky','hills','trees'].forEach(k=>load(k,`art/bg-${k}.png`));
  // For platform tiles, find the first opaque row (the top of the grass) and the dirt color along the bottom edge.
  const tile=img=>{ const t={img,top:0,bottom:'#b97a45'};
    try{ const cv=document.createElement('canvas'); cv.width=img.width; cv.height=img.height;
      const x=cv.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0); const d=x.getImageData(0,0,img.width,img.height).data;
      find: for(let y=0;y<img.height;y++) for(let i=0;i<img.width;i+=2){ if(d[(y*img.width+i)*4+3]>60){ t.top=y; break find; } }
      let r=0,g=0,b=0,n=0; const y=img.height-3;
      for(let i=0;i<img.width;i+=4){ const o=(y*img.width+i)*4; if(d[o+3]>200){ r+=d[o]; g+=d[o+1]; b+=d[o+2]; n++; } }
      if(n) t.bottom=`rgb(${r/n|0},${g/n|0},${b/n|0})`;
    }catch(e){}
    return t; };
  [['left','tile-ledge-left'],['mid','tile-ledge-mid'],['right','tile-ledge-right'],['ground','tile-ground']].forEach(([k,f])=>load('t_'+k,`art/${f}.png`,tile));
}
const TILE_S=40/128;   // a 128px-tall ledge tile becomes 40 game units tall
function tileLayer(c,img,par,yOff){
  const s=VIEW_H/img.height, W=img.width*s;
  let x=-((cam.x*par)%W); if(x>0) x-=W;
  for(;x<VIEW_W;x+=W) c.drawImage(img,x,yOff,W+1,VIEW_H);
}
function drawLedge(c,pl){
  const L=SCENE.t_left, M=SCENE.t_mid, R=SCENE.t_right, s=TILE_S;
  const tw=L.img.width*s, th=L.img.height*s, y=pl.y-L.top*s-5, x0=pl.x-14, x1=pl.x+pl.w+14;
  for(let x=x0+tw*.9;x<x1-tw*.9;x+=M.img.width*s){ const w=Math.min(M.img.width*s,x1-tw*.9-x); c.drawImage(M.img,0,0,w/s,M.img.height,x,y,w+1,M.img.height*s); }
  c.drawImage(L.img,x0,y,tw,th);
  c.drawImage(R.img,x1-R.img.width*s,y,R.img.width*s,R.img.height*s);
}
function drawGroundTiles(c,pl){
  const G=SCENE.t_ground, s=TILE_S, tw=G.img.width*s, th=G.img.height*s, y=pl.y-G.top*s-5;
  c.fillStyle=G.bottom; c.fillRect(cam.x-20,y+th-2,VIEW_W+40,MAP.h-(y+th)+2);
  for(let x=Math.floor((cam.x-20)/tw)*tw;x<cam.x+VIEW_W+20;x+=tw) c.drawImage(G.img,x,y,tw+1,th);
}
function drawPropSprite(c,key,x,y,frame){
  const sp=SPR[key]; if(!sp||!sp.idle) return false;
  c.save(); c.translate(x,y); drawSheet(c,sp.idle,frame||0,false); c.restore(); return true;
}
loadScenery();

function drawSky(c){
  if(SCENE.sky){ tileLayer(c,SCENE.sky,.03,0); return; }
  const g=c.createLinearGradient(0,0,0,VIEW_H); g.addColorStop(0,'#5fb8ff'); g.addColorStop(.55,'#a9dcff'); g.addColorStop(1,'#e6f7ff');
  c.fillStyle=g; c.fillRect(0,0,VIEW_W,VIEW_H);
  // sun
  const sx=780-cam.x*.02, sy=95-cam.y*.03;
  const sg=c.createRadialGradient(sx,sy,10,sx,sy,120); sg.addColorStop(0,'rgba(255,248,200,.95)'); sg.addColorStop(1,'rgba(255,248,200,0)');
  c.fillStyle=sg; c.fillRect(sx-120,sy-120,240,240);
  ell(c,sx,sy,34,34); c.fillStyle='#fff6c4'; c.fill();
  // clouds
  for(const cl of SCN.clouds){

  }
}
function drawCloud(c,x,y,s){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle='rgba(160,200,235,.45)'; ell(c,10,14,70,16); c.fill();
  c.fillStyle='#ffffff';
  [[-40,4,26],[-12,-10,34],[22,-4,30],[48,6,22],[0,8,40]].forEach(([a,b,r])=>{ ell(c,a,b,r,r*.78); c.fill(); });
  c.restore();
}
function drawParallax(c){
  // far hills
  let par=.18, base=470+(400-cam.y)*par;
  if(SCENE.hills) tileLayer(c,SCENE.hills,par,40+(400-cam.y)*par);
  else {
  c.fillStyle='#a6dca0';
  for(const h of SCN.hillsFar){ const x=h.x-cam.x*par; if(x<-260||x>VIEW_W+260) continue; ell(c,x,base,h.rw,h.h); c.fill(); }
  c.fillStyle='#a6dca0'; c.fillRect(0,base,VIEW_W,VIEW_H);
  }
  // mid round trees
  par=.42; base=505+(400-cam.y)*par;
  if(SCENE.trees){ tileLayer(c,SCENE.trees,par,20+(400-cam.y)*par); return; }
  for(const t of SCN.treesMid){
    const x=t.x-cam.x*par; if(x<-80||x>VIEW_W+80) continue;
    c.fillStyle='#86b96a'; c.fillRect(x-4,base-t.h*.45,8,t.h*.45);
    c.fillStyle=t.k>.5?'#7fcf63':'#6cc25a';
    ell(c,x,base-t.h*.6,34*t.s,t.h*.42); c.fill();
    c.fillStyle='rgba(255,255,255,.18)'; ell(c,x-10*t.s,base-t.h*.72,14*t.s,t.h*.14); c.fill();
  }
  c.fillStyle='#78c55e'; c.fillRect(0,base,VIEW_W,VIEW_H);
  // soft haze
  const g=c.createLinearGradient(0,base-90,0,base+20); g.addColorStop(0,'rgba(230,247,255,0)'); g.addColorStop(1,'rgba(230,247,255,.55)');
  c.fillStyle=g; c.fillRect(0,base-90,VIEW_W,110);
}

function drawBigTree(c,x,s){
  const gy=MAP.platforms[0].y;
  c.save(); c.translate(x,gy); c.scale(s,s);
  if(SPR.bigtree&&SPR.bigtree.idle){ drawSheet(c,SPR.bigtree.idle,0,false); c.restore(); return; }
  c.fillStyle='#a8744a'; c.beginPath(); c.moveTo(-22,0); c.quadraticCurveTo(-14,-140,-12,-300); c.lineTo(12,-300); c.quadraticCurveTo(14,-140,26,0); c.closePath(); c.fill();
  c.fillStyle='#8c5d39'; c.fillRect(-4,-260,4,200);
  const blobs=[[-70,-300,70],[0,-360,90],[70,-300,70],[-30,-250,60],[40,-240,60]];
  c.fillStyle='#4fae46'; blobs.forEach(([a,b,r])=>{ ell(c,a,b+8,r,r*.85); c.fill(); });
  c.fillStyle='#62c454'; blobs.forEach(([a,b,r])=>{ ell(c,a,b,r,r*.85); c.fill(); });
  c.fillStyle='rgba(255,255,255,.2)'; blobs.forEach(([a,b,r])=>{ ell(c,a-r*.3,b-r*.35,r*.4,r*.25); c.fill(); });
  c.restore();
}

function drawPlatforms(c){
  MAP.platforms.forEach((pl,i)=>{
    if(pl.x>cam.x+VIEW_W+40||pl.x+pl.w<cam.x-40) return;
    const D=SCN.decor[i];
    if(pl.ground&&SCENE.t_ground){ drawGroundTiles(c,pl); return; }
    if(!pl.ground&&SCENE.t_left&&SCENE.t_mid&&SCENE.t_right){ drawLedge(c,pl); return; }
    if(pl.ground){

function analyzeSheet(img,frames){
  const fw=Math.round(img.width/frames), fh=img.height;
  const out={img,frames,fw,fh,ax:fw/2,fy:fh*.96,h:fh*.85,w:fw*.6};
  try{
    const cv=document.createElement('canvas'); cv.width=img.width; cv.height=fh;
    const cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(img,0,0);
    const d=cx.getImageData(0,0,img.width,fh).data;
    const cents=[],bottoms=[],hs=[],ws=[],mids=[];
    for(let f=0;f<frames;f++){
      let minX=1e9,maxX=-1,minY=1e9,maxY=-1,sx=0,n=0;
      for(let y=0;y<fh;y+=2) for(let x=f*fw;x<(f+1)*fw;x+=2){
        if(d[(y*img.width+x)*4+3]>60){ const lx=x-f*fw; if(lx<minX)minX=lx; if(lx>maxX)maxX=lx; if(y<minY)minY=y; if(y>maxY)maxY=y; sx+=lx; n++; } }
      if(n){ cents.push(sx/n); bottoms.push(maxY); hs.push(maxY-minY); ws.push(maxX-minX); mids.push((minY+maxY)/2); }
    }
    if(cents.length){
      const med=a=>a.slice().sort((p,q)=>p-q)[Math.floor(a.length/2)];
      out.ax=cents.reduce((a,b)=>a+b,0)/cents.length; out.fy=Math.max(...bottoms)+1; out.h=med(hs); out.w=med(ws);
      out.cy=mids.reduce((a,b)=>a+b,0)/mids.length;
    }
  }catch(e){ /* opened from disk: pixels can't be read, use the defaults */ }
  return out;
}
function loadSprites(){
  for(const [key,set] of Object.entries(SPRITE_SET)){
    for(const [anim,[src,frames]] of Object.entries(set.sheets)){
      const img=new Image();
      img.onload=()=>{
        // Frames are square, so the frame count comes from the image itself (a 2048x256 strip = 8 frames).
        const sh=analyzeSheet(img,Math.max(1,Math.round(img.width/img.height))||frames);
        if(set.center) sh.fy=sh.cy??sh.fh/2;   // flying monsters are positioned by their middle, not their feet
        const ref=set.target.h?{size:sh.h,want:set.target.h}:{size:sh.w,want:set.target.w};
        sh.scale=ref.want/Math.max(1,ref.size);
        (SPR[key]=SPR[key]||{})[anim]=sh;
        // keep every sheet of one character at the standing sheet's scale (leaning, tucked or squashed poses would otherwise be enlarged)
        if(SPR[key].idle) for(const k in SPR[key]) SPR[key][k].scale=SPR[key].idle.scale;
      };
      img.src=src;
    }
  }
}
function drawSheet(c,sh,frame,flash){
  const s=sh.scale, f=((frame%sh.frames)+sh.frames)%sh.frames;
  const args=[sh.img,f*sh.fw,0,sh.fw,sh.fh,-sh.ax*s,-sh.fy*s,sh.fw*s,sh.fh*s];
  c.imageSmoothingEnabled=true; c.imageSmoothingQuality='high';
  c.drawImage(...args);
  if(flash){ c.save(); c.globalCompositeOperation='lighter'; c.globalAlpha*=.6; c.drawImage(...args); c.restore(); }
}
// Compact heroes. Poses without their own sheet yet are made from the standing pose:
// a forward lean for attacks, a full spin for the double jump, a run frame in the air.
function drawHeroSprite(c,cls,s){
  const sp=SPR[cls]; if(!sp||!sp.idle) return false;
  let sh=sp.idle, fr=Math.floor(s.t*6), rot=0, spin=false, breathe=false;
  if(s.climb){ if(sp.climb){ sh=sp.climb; fr=Math.floor((s.climbPh||0)*8); } }
  else if(s.swing>=0){ const pose=((s.key==='s'||s.key==='d')&&sp.cast)?sp.cast:sp.attack; if(pose){ sh=pose; fr=Math.min(sh.frames-1,Math.floor(s.swing*sh.frames)); } else rot=Math.sin(Math.min(1,s.swing*1.5)*Math.PI)*.18; }
  else if(s.dj>=0){ if(sp.jump){ sh=sp.jump; fr=0; } else if(sp.run){ sh=sp.run; fr=2; } rot=Math.sin(Math.min(1,s.dj*1.3)*Math.PI)*.22; }
  else if(s.air){ if(sp.jump){ sh=sp.jump; fr=Math.round((clamp((s.vy||0)/500,-1,1)+1)/2*(sh.frames-1)); } else if(sp.run){ sh=sp.run; fr=2; } }
  else if(s.walk&&(sp.run||sp.walk)){ sh=sp.run||sp.walk; fr=Math.floor(s.t*(sp.run?14:12)); }
  else breathe=sh.frames===1;
  if(rot||breathe){
    const mid=spin?-sh.h*sh.scale*.5:0;
    c.save(); c.translate(0,mid); if(rot) c.rotate(rot); c.translate(0,-mid);
    if(breathe) c.scale(1,1+Math.sin(s.t*2.6)*.018);
    drawSheet(c,sh,fr,false); c.restore();
  } else drawSheet(c,sh,fr,false);
  return true;
}

  // back arm
  const ba=walk?-Math.sin(ph)*.6:.15;
  limb(c,-4,-30+by,ba+1.57,11,P.body,P.skin);
  // legs
  leg(c,-4,lA,P); leg(c,4,lB,P);
  // torso

    if(cls==='warrior'){ rr(c,-12,-37+by,9,8,4); fs(c,'#cfe0ff',2); } }

function drawMob(c,m){

function drawMobSprite(c,m,fl){
  const sp=SPR[m.type]; if(!sp||!sp.idle) return false;
  const off=m.seed*3;
  let sh=sp.idle, fr=Math.floor(clock*6+off);
  if((m.hitT>0||m.stun>0)&&sp.hit){ sh=sp.hit; fr=m.hitT>.08?0:1; }
  else if(m.state==='windup'&&sp.windup){ sh=sp.windup; fr=Math.floor(clock*12); }
  else if(m.state==='charge'&&sp.charge){ sh=sp.charge; fr=Math.floor(clock*16); }
  else if(m.type==='wisp'&&m.aggro&&m.shootT>2.2&&sp.shoot){ sh=sp.shoot; fr=Math.min(sh.frames-1,Math.floor((2.6-m.shootT)/.4*sh.frames)); }
  else if(m.moving&&sp.move){ sh=sp.move; fr=Math.floor(clock*(m.type==='wisp'?8:11)+off); }
  if(m.type==='wisp') c.translate(0,Math.sin(clock*3+m.seed)*3);

}

/* ---------- main render */
function render(dt){
  const c=ctx; c.setTransform(scale,0,0,scale,0,0);
  const p=me();
  if(p){
    const tx=clamp(p.x-VIEW_W/2,0,MAP.w-VIEW_W), ty=clamp(p.y-VIEW_H*.6,0,MAP.h-VIEW_H);
    cam.x+=(tx-cam.x)*Math.min(1,dt*7); cam.y+=(ty-cam.y)*Math.min(1,dt*5);
  } else { cam.x=(Math.sin(clock*.05)*.5+.5)*(MAP.w-VIEW_W); cam.y+=(330-cam.y)*Math.min(1,dt*2); }
  drawSky(c); drawParallax(c);
  c.save();
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake; shake=Math.max(0,shake-dt*40);
  c.translate(-cam.x+sx,-cam.y+sy);
  for(const t of SCN.bigTrees) if(t.x>cam.x-260&&t.x<cam.x+VIEW_W+260) drawBigTree(c,t.x,t.s);
  drawRopes(c); drawPlatforms(c); drawCamp(c); drawPortal(c);
  drawDrops(c);
  for(const m of world.mobs) drawMob(c,m);
  for(const id in world.players) drawPlayer(c,world.players[id]);
  drawProjectiles(c); drawEffects(c,dt); drawSpriteFx(c,dt); skillVfx?.draw(c,dt); drawNumbers(c,dt); drawMotes(c);
  c.restore();
  if(screenFx.a>0){ c.save(); c.globalAlpha=screenFx.a; c.fillStyle=screenFx.c; c.fillRect(0,0,VIEW_W,VIEW_H); c.restore(); screenFx.a=Math.max(0,screenFx.a-dt*2.2); }
  if(p) drawHUD(c,p);
  for(const l of logs) l.t+=dt; for(const t of toasts) t.t+=dt;
  for(let i=toasts.length-1;i>=0;i--) if(toasts[i].t>3) toasts.splice(i,1);
  for(let i=logs.length-1;i>=0;i--) if(logs[i].t>5) logs.splice(i,1);
}

/* ---------- loop */
let acc=0, last=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-last)/1000); last=now; clock+=dt;
  if(!paused){ if(running) sendInput(); acc+=dt; while(acc>=STEP){ stepWorld(world,STEP); acc-=STEP; } drainEvents(); }
  render(paused?0:dt);
  if(!titleEl.hidden) drawPreviews();
  if(CREATOR.isOpen()) CREATOR.tick();
  requestAnimationFrame(frame);
}

      Open:()=>{ c.fillStyle='#b8404a'; E(c,168,173,6,7); c.fill(); c.lineWidth=3; c.strokeStyle='#5a2a2a'; c.stroke(); c.fillStyle='#ff8b95'; E(c,168,177,3.4,2.4); c.fill(); }})[o.mouth]();

    else if(!PART['head-'+g]){ const cheek=a=>{ c.fillStyle=`rgba(255,110,130,${a})`; E(c,138,166,9,5); c.fill(); E(c,192,165,7,4.4); c.fill(); };
      cheek(o.extra==='Blush'?.55:.22);
      if(o.extra==='Freckles'){ c.fillStyle='#b4643f'; for(const [x,y] of [[130,162],[136,166],[141,161],[188,161],[194,165]]){ E(c,x,y,1.8,1.8); c.fill(); } }
      if(o.extra==='Bandage'){ oc.save(); oc.translate(132,170); oc.rotate(-.35); oc.fillStyle='#fff1d8'; oc.strokeStyle='#8a6a44'; oc.lineWidth=2.4; oc.beginPath(); oc.rect(-13,-6,26,12); oc.fill(); oc.stroke(); oc.fillStyle='#e8cfa6'; oc.fillRect(-4,-6,8,12); oc.restore(); }
      if(o.extra==='Glasses'){ oc.lineWidth=3.4; oc.strokeStyle='#2b2140'; E(oc,146,146,17,15); oc.stroke(); E(oc,184,146,13,14); oc.stroke(); oc.beginPath(); oc.moveTo(163,144); oc.lineTo(171,144); oc.moveTo(129,142); oc.lineTo(96,136); oc.stroke(); oc.fillStyle='rgba(255,255,255,.35)'; E(oc,140,140,6,4,-.5); oc.fill(); } }
    return {fixed,iris,brow,over}; }
  function standInBody(cls){ const cv=layer(), c=cv.getContext('2d');
    const col={warrior:['#7fb2ff','#4d7fd6','#ff5d6c','#7a4a2a'],mage:['#a77bff','#7552d9','#ffd23f','#5a3a8a'],archer:['#6fd46a','#3fa346','#fff1b8','#6a4528']}[cls];
    if(cls==='warrior'){ PTH(c,[[112,198],[86,236],[94,252],[120,226]]); F(c,col[2]); }
    for(const x of [114,140]){ c.beginPath(); c.rect(x,224,18,22); F(c,'#5a4a6a'); E(c,x+11,248,13,7); F(c,col[3]); }
    if(cls==='mage'){ PTH(c,[[106,196],[154,196],[166,240],[94,240]]); F(c,col[0]); c.fillStyle=col[2]; c.fillRect(98,232,64,5); }
    else { c.beginPath(); c.roundRect(104,194,52,40,12); F(c,col[0]); c.fillStyle=col[1]; c.fillRect(106,222,48,7); c.fillStyle='#ffd23f'; c.fillRect(126,222,9,7); }
    E(c,108,206,10,12); F(c,col[1]); E(c,152,206,10,12); F(c,col[1]);
    if(cls==='warrior'){ c.save(); c.translate(160,222); c.rotate(.5); c.beginPath(); c.rect(-4,-6,8,56); F(c,'#eef4ff'); c.beginPath(); c.rect(-12,-8,24,7); F(c,'#ffd23f'); c.restore(); }
    if(cls==='mage'){ c.beginPath(); c.rect(162,150,7,96); F(c,'#b07a48'); E(c,165,146,11,11); F(c,'#ffe27a'); }
    if(cls==='archer'){ c.lineWidth=5; c.strokeStyle='#2b2140'; c.beginPath(); c.moveTo(166,176); c.quadraticCurveTo(196,214,166,252); c.stroke(); c.lineWidth=3; c.strokeStyle='#c98a4f'; c.stroke(); c.lineWidth=1.4; c.strokeStyle='#fff'; c.beginPath(); c.moveTo(166,176); c.lineTo(166,252); c.stroke(); }
    E(c,154,232,8,8); F(c,'#d9b38c'); return cv; }

  /* ---- head = what goes behind the body (back hair) + everything in front, both on the 256 head template */
  const headCache=new Map();
  function head(o,blink){ const k=JSON.stringify(o)+blink; if(headCache.has(k)) return headCache.get(k);
    const skin=SKIN[o.skin][1], hc=HAIRC[o.hairColor][1], ec=EYEC[o.eyeColor][1], hair=hairParts(o.hair), face=faceParts(o,blink);
    const back=recolor(hair.back,hc), front=layer(), c=front.getContext('2d');
    c.drawImage(recolor(headBase(o.gender),skin),0,0); c.drawImage(face.fixed,0,0); if(!blink) c.drawImage(tint(face.iris,ec),0,0);
    c.drawImage(tint(face.brow,hc),0,0); c.drawImage(face.over,0,0); c.drawImage(recolor(hair.front,hc),0,0);
    const r={back,front}; if(headCache.size>40) headCache.clear(); headCache.set(k,r); return r; }
  // Seen from behind (climbing): ChatGPT's back-of-head hair over the skin-toned head; without it, the head shape filled with hair color.
  function headRear(o){ const k='rear'+JSON.stringify(o); if(headCache.has(k)) return headCache.get(k);
    const hc=HAIRC[o.hairColor][1], front=layer(), c=front.getContext('2d'), rear=layer();
    if(useP(rear,'hair-'+slug(o.hair)+'-rear')){ c.drawImage(recolor(headBase(o.gender),SKIN[o.skin][1]),0,0); c.drawImage(recolor(rear,hc),0,0); }
    else { const hair=hairParts(o.hair); c.drawImage(tint(headBase(o.gender),hc),0,0); c.drawImage(tint(hair.back,hc),0,0); c.drawImage(tint(hair.front,hc),0,0); }
    const r={back:layer(),front}; headCache.set(k,r); return r; }
  // Full character on a 256 canvas for the creator screen. With ChatGPT's body it's composed in the body frame's
  // coordinates (the head goes on the frame's neck point); with the stand-in body, in the head template's.
  function full(o,cls,blink){ const out=layer(), c=out.getContext('2d'), h=head(o,blink), b=BODY[cls]&&BODY[cls].idle;
    if(b){ c.save(); c.translate(128,250); drawFrame(c,cls,o,b,0,blink,OVERALL,false); c.restore(); out.feet=250; }
    else { c.drawImage(h.back,0,0); c.drawImage(standInBody(cls),0,0); c.drawImage(h.front,0,0); out.feet=252; }
    return out; }
  // Thumbnail crops (x, y, size on the head template) for each option row; ChatGPT's head sits lower than the stand-in.
  const CROP={stand:{eyes:[118,108,96],brows:[118,96,96],mouth:[136,140,64],extra:[88,88,140],hair:[24,22,216]},
              art:{eyes:[100,123,84],brows:[100,111,84],mouth:[123,160,52],extra:[80,111,110],hair:[26,72,200]}};
  CROP.art.face=[92,124,104];
  const crop=k=>CROP[PART['head-'+look.gender]?'art':'stand'][k];
  const hasFaces=()=>!!PART['face-'+look.gender+'-1'];

  /* ---- in the game: custom look once the class has its headless bodies */
  function drawGame(c,cls,s){
    const B=BODY[cls]; if(!compactParts||!B||!B.idle||!B.attack||!B.jump||!(B.run||B.walk)||!s.look) return false;
    let sh=B.idle, fr=Math.floor(s.t*6);
    if(s.climb&&B.climb){ sh=B.climb; fr=Math.floor((s.climbPh||0)*8); }
    else if(s.swing>=0){ sh=((s.key==='s'||s.key==='d')&&B.cast)?B.cast:B.attack; fr=Math.min(sh.frames-1,Math.floor(s.swing*sh.frames)); }
    else if(s.air){ sh=B.jump; fr=Math.round((clamp((s.vy||0)/500,-1,1)+1)/2*(sh.frames-1)); }
    else if(s.walk){ sh=B.run||B.walk; fr=Math.floor(s.t*(B.run?14:12)); }
    fr=((fr%sh.frames)+sh.frames)%sh.frames;
    drawFrame(c,cls,s.look,sh,fr,(s.t%4)>3.86,((SPR[cls]&&SPR[cls].idle&&SPR[cls].idle.scale)||74/232)*OVERALL,sh===B.climb);
    return true; }
  function drawFrame(c,cls,look,sh,fr,blink,sc,rear){
    const n=(sh.neck&&sh.neck[fr])||[sh.ax,sh.fy-200];
    // The head turns around its neck point by the frame's "rot" (degrees), so it follows the body through flips.
    const sb=sc*BODY_SCALE, sh2=sc*HEAD_SCALE;
    const h=rear?headRear(look):head(look,blink), nx=(n[0]-sh.ax)*sb, ny=(n[1]-sh.fy)*sb, rot=((sh.rot&&sh.rot[fr])||0)*Math.PI/180;
    const drawHead=l=>{ c.save(); c.translate(nx,ny); if(rot) c.rotate(rot); c.drawImage(l,-128*sh2,-(200-NECK_DROP)*sh2,256*sh2,256*sh2); c.restore(); };
    drawHead(h.back);
    c.drawImage(sh.img,fr*sh.fw,0,sh.fw,sh.fh,-sh.ax*sb,-sh.fy*sb,sh.fw*sb,sh.fh*sb);
    drawHead(h.front); }
  // #posecheck on the page URL: every frame of every pose for one class, with a custom head attached (for checking art).
  function poseCheck(cls,look){ const B=BODY[cls]; if(!B) return null; const poses=POSES.filter(p=>B[p]), cell=150, cv=document.createElement('canvas');
    cv.width=cell*8; cv.height=cell*poses.length; const c=cv.getContext('2d'); c.fillStyle='#cfe9ff'; c.fillRect(0,0,cv.width,cv.height);
    poses.forEach((p,r)=>{ const sh=B[p]; c.fillStyle='#2b2140'; c.font='bold 13px sans-serif'; c.fillText(p,6,r*cell+16);
      for(let f=0;f<sh.frames&&f<8;f++){ c.save(); c.translate(f*cell+cell/2,r*cell+cell-14); drawFrame(c,cls,look,sh,f,false,.5,p==='climb'); c.restore();
        c.strokeStyle='rgba(43,33,64,.15)'; c.strokeRect(f*cell,r*cell,cell,cell); } });
    return cv; }

  /* ---- the screen */
  const el=document.getElementById('creator'), stage=document.getElementById('crStage').getContext('2d');
  const nameEl=document.getElementById('crNameInput'), errEl=document.getElementById('crErr'), doneEl=document.getElementById('crDone');
  const tabsEl=document.getElementById('crTabs'), bodyEl=document.getElementById('crBody');
  let look={...DEFAULT_LOOK}, cls='warrior', tab='Body', confirmReplace=false, cacheKey='', cached=null, onCreate=null, onBack=null;
  const changed=()=>{ confirmReplace=false; doneEl.textContent=''; who(); };
  function who(){ document.getElementById('crWho').textContent=nameEl.value.trim()||'Hero';
    document.getElementById('crLine').textContent=`${look.gender==='male'?'Male':'Female'} ${CLASSES[cls].name} · Lv 1`; }
  const TABS=[['Body',()=>{ const g=group('Body'); for(const [v,l] of [['male','Male'],['female','Female']]){ const b=opt(l,look.gender===v,null); b.onclick=()=>{ if(look.gender!==v){ look.gender=v; look.hair=HAIR[v][0]; if(!EYES[v].includes(look.eyes)) look.eyes=EYES[v][0]; } draw(); changed(); }; g.appendChild(b); }
      swatch(group('Skin tone'),'skin',SKIN); }],
    ['Face',()=>{ if(hasFaces()){ choice(group('Face'),'face',FACES,crop('face'),v=>'Face '+v); swatch(group('Eye color'),'eyeColor',EYEC); choice(group('Extras'),'extra',EXTRA,crop('extra')); return; }
      choice(group('Eyes'),'eyes',EYES[look.gender],crop('eyes')); swatch(group('Eye color'),'eyeColor',EYEC);
      choice(group('Brows'),'brows',BROWS,crop('brows')); choice(group('Mouth'),'mouth',MOUTH,crop('mouth')); choice(group('Extras'),'extra',EXTRA,crop('extra')); }],
    ['Hair',()=>{ choice(group('Hairstyle'),'hair',HAIR[look.gender],crop('hair')); swatch(group('Hair color'),'hairColor',HAIRC); }],
    ['Class',()=>{ const box=document.createElement('div'); box.className='cr-classes'; bodyEl.appendChild(box);
      for(const k of Object.keys(CLASSES)){ const C=CLASSES[k], b=document.createElement('button'); b.type='button'; b.className='cr-cls'; b.setAttribute('aria-pressed',cls===k);
        b.innerHTML=`<b>${C.name}</b><small>${C.blurb}</small>`; b.onclick=()=>{ cls=k; box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); changed(); }; box.appendChild(b); } }]];
  function draw(){ tabsEl.innerHTML=''; for(const [l] of TABS){ const b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.textContent=l; b.setAttribute('aria-selected',tab===l); b.onclick=()=>{ tab=l; draw(); }; tabsEl.appendChild(b); }
    bodyEl.innerHTML=''; TABS.find(t=>t[0]===tab)[1](); }
  function group(t){ const g=document.createElement('div'); g.className='cr-group'; g.innerHTML=`<h3>${t}</h3><div class="cr-opts"></div>`; bodyEl.appendChild(g); return g.querySelector('.cr-opts'); }
  function opt(label,on,cv){ const b=document.createElement('button'); b.type='button'; b.className='cr-opt'+(cv?'':' text'); b.setAttribute('aria-pressed',on); if(cv) b.appendChild(cv); const s=document.createElement('span'); s.textContent=label; b.appendChild(s); return b; }
  function thumb(o,cr){ const cv=document.createElement('canvas'); cv.width=cv.height=112; const c=cv.getContext('2d'), h=head(o,false);
    for(const l of [h.back,h.front]) c.drawImage(l,cr[0],cr[1],cr[2],cr[2],0,0,112,112); return cv; }
  function choice(box,key,values,crop,label){ for(const v of values){ const b=opt(label?label(v):v,look[key]===v,thumb({...look,[key]:v},crop)); b.onclick=()=>{ look[key]=v; box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); changed(); }; box.appendChild(b); } }
  function swatch(box,key,list){ list.forEach(([n,h],i)=>{ const b=document.createElement('button'); b.type='button'; b.className='cr-sw'; b.style.background=h; b.title=n; b.setAttribute('aria-label',n); b.setAttribute('aria-pressed',look[key]===i);
    b.onclick=()=>{ look[key]=i; box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); changed(); }; box.appendChild(b); }); }
  function tick(){ const t=clock, blink=(t%3.6)>3.45, bob=Math.round(Math.sin(t*2.6)*3), k=JSON.stringify(look)+cls+blink+Object.keys(PART).length;
    if(k!==cacheKey){ cached=full(look,cls,blink); cacheKey=k; }
    stage.clearRect(0,0,512,512);
    stage.fillStyle='#78c55e'; stage.beginPath(); stage.ellipse(256,462,170,34,0,0,Math.PI*2); stage.fill();
    stage.fillStyle='#5cc44a'; stage.beginPath(); stage.ellipse(256,456,170,30,0,0,Math.PI*2); stage.fill();
    stage.fillStyle='rgba(40,60,40,.22)'; stage.beginPath(); stage.ellipse(262,458,72,12,0,0,Math.PI*2); stage.fill();
    stage.drawImage(cached,0,0,256,256,0,462-cached.feet*2+bob,512,512); }
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const NAMES=['Pip','Rowan','Juniper','Bram','Marigold','Fennel','Wren','Tansy','Basil','Clover','Sorrel','Hazel'];
  document.getElementById('crRand').onclick=()=>{ const g=pick(['male','female']);
    look={gender:g,skin:Math.floor(Math.random()*SKIN.length),face:pick(FACES),eyes:pick(EYES[g]),eyeColor:Math.floor(Math.random()*EYEC.length),brows:pick(BROWS),mouth:pick(MOUTH),
      extra:Math.random()<.6?'None':pick(EXTRA.slice(1)),hair:pick(HAIR[g]),hairColor:Math.floor(Math.random()*HAIRC.length)};
    if(!nameEl.value.trim()) nameEl.value=pick(NAMES); errEl.textContent=''; draw(); changed(); };
  document.getElementById('crBack').onclick=()=>{ el.hidden=true; onBack&&onBack(); };
  nameEl.addEventListener('input',()=>{ errEl.textContent=''; changed(); });
  document.getElementById('crCreate').onclick=()=>{
    const n=nameEl.value.trim();
    if(n.length<2){ errEl.textContent='Enter a name of at least 2 letters.'; nameEl.focus(); return; }
    if(!/^[A-Za-z0-9 ]+$/.test(n)){ errEl.textContent='Use letters, numbers and spaces only.'; nameEl.focus(); return; }
    const old=saves.slots[cls];
    if(old&&!confirmReplace){ confirmReplace=true; doneEl.textContent=`This replaces your Lv ${old.level} ${old.name||CLASSES[cls].name}. Click Create again to replace it.`; return; }
    el.hidden=true; onCreate&&onCreate(cls,n,{...look}); };
  function open(startCls,cb,back){ cls=startCls||'warrior'; look={...DEFAULT_LOOK}; nameEl.value=''; errEl.textContent=''; tab='Body'; onCreate=cb; onBack=back; changed(); draw(); el.hidden=false; nameEl.focus(); }
  if(location.hash==='#posecheck'){ const looks=[{gender:'male',skin:2,eyes:'Sharp',eyeColor:4,brows:'Bold',mouth:'Grin',extra:'None',hair:'Spiky',hairColor:3},
      {gender:'female',skin:4,eyes:'Lashes',eyeColor:5,brows:'Soft',mouth:'Smile',extra:'Glasses',hair:'Twin tails',hairColor:6},
      {gender:'female',skin:0,eyes:'Round',eyeColor:3,brows:'Raised',mouth:'Open',extra:'Freckles',hair:'Long',hairColor:1}];
    const box=document.createElement('div'); box.style.cssText='position:fixed;inset:0;z-index:50;overflow:auto;background:#fff;padding:8px';
    document.body.appendChild(box); let tries=0;
    const t=setInterval(()=>{ tries++; const ready=['warrior','mage','archer'].every(k=>BODY[k]&&POSES.every(p=>BODY[k][p])); if(!ready&&tries<60) return; clearInterval(t);
      ['warrior','mage','archer'].forEach((k,i)=>{ const cv=poseCheck(k,looks[i]); if(cv){ cv.style.cssText='display:block;max-width:100%;margin-bottom:8px'; cv.id='pc-'+k; box.appendChild(cv); } });
      document.title='posecheck ready'; },250); }
  return {open,tick,drawGame,isOpen:()=>!el.hidden};
})();

/* ---------- menus */
const titleEl=document.getElementById('title'), pauseEl=document.getElementById('pause'), cardsEl=document.getElementById('cards');
const previews=[];
function buildCards(){
  cardsEl.innerHTML=''; previews.length=0;
  for(const cls of Object.keys(CLASSES)){
    const C=CLASSES[cls], save=saves.slots[cls];
    const b=document.createElement('button'); b.className='card'; b.type='button';
    b.innerHTML=`<canvas width="300" height="240"></canvas><div class="role">${C.role}</div><h2>${C.name}</h2><p>${C.blurb}</p>
      <div class="rating">${Object.entries(C.ratings).map(([k,v])=>`<span>${k}</span><span class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=v?'on':''}"></i>`).join('')}</span>`).join('')}</div>
      <div class="skl">${SKILL_KEYS.map(k=>`<span>${KEY_LABEL[k]} · ${C.skills[k].name}</span>`).join('')}</div>
      <div class="play">${save?`Continue${save.name?` as ${esc(save.name)}`:""} · Lv ${save.level}`:`Create a ${C.name}`}</div>`;
    b.addEventListener('click',()=>save?startGame(cls):openCreator(cls));
    cardsEl.appendChild(b);
    previews.push({cls,cv:b.querySelector('canvas'),hover:false});
    b.addEventListener('mouseenter',()=>previews.find(p=>p.cls===cls).hover=true);
    b.addEventListener('mouseleave',()=>previews.find(p=>p.cls===cls).hover=false);
  }
}
function drawPreviews(){
  for(const pv of previews){
    const c=pv.cv.getContext('2d'); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,300,240);
    c.fillStyle='#78c55e'; c.fillRect(0,196,300,44); c.fillStyle='#5cc44a'; c.fillRect(0,192,300,10);
    c.fillStyle='rgba(40,60,40,.22)'; ell(c,150,196,40,10); c.fill();
    c.save(); c.translate(150,194); c.scale(2.6,2.6);
    const cyc=(clock*1.4)%1, sw=pv.hover?cyc:-1;
    drawHero(c,pv.cls,{t:clock,walk:false,air:false,swing:sw,key:'basic'});
    c.restore();
  }
}
const esc=t=>String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function openCreator(cls){
  titleEl.hidden=true;
  CREATOR.open(cls,(c,name,look)=>{
    saves.slots[c]={level:1,xp:0,gold:0,hpPot:5,mpPot:5,name,look}; saves.last=c;
    try{ localStorage.setItem(SAVE_KEY,JSON.stringify(saves)); }catch(e){}
    startGame(c);
  },()=>{ buildCards(); titleEl.hidden=false; });
}
document.getElementById('newCharBtn').addEventListener('click',()=>openCreator('warrior'));
function startGame(cls){
  const save=saves.slots[cls]||{};
  world=createWorld();
  const p=addPlayer(world,ME,Object.assign({cls},save));
  cam.x=clamp(p.x-VIEW_W/2,0,MAP.w-VIEW_W); cam.y=clamp(p.y-VIEW_H*.6,0,MAP.h-VIEW_H);
  effects.length=numbers.length=particles.length=logs.length=toasts.length=0;
  skillVfx?.clear();
  for(const k in held) held[k]=false; skillOrder=[]; lastInput='';
  titleEl.hidden=true; running=true; paused=false;
  toast((save.level>1||save.xp)?`Welcome back, ${save.name||'Lv '+save.level+' '+CLASSES[cls].name}`:`Welcome to ${MAP.name}${save.name?', '+save.name:''}!`);
  writeSave(); canvas.focus?.();
}
function togglePause(){
  paused=!paused; pauseEl.hidden=!paused;
  if(paused){
    const p=me(), C=CLASSES[p.cls];
    document.getElementById('skillTable').innerHTML=
      SKILL_KEYS.map(k=>{ const s=C.skills[k]; return `<tr><td><kbd>${KEY_LABEL[k]}</kbd> ${s.name}</td><td>${s.desc}${s.mp?` <b style="color:#2f86ff">${s.mp} MP</b>`:''}${s.cd?` · ${s.cd}s cooldown`:''}</td></tr>`; }).join('')+
      `<tr><td>Movement</td><td>Arrows to move and climb, Space to jump (press again in the air to double jump${C.doubleJump?', extra long for the Ranger':''}), Down + Space to drop off a ledge.</td></tr>
       <tr><td><kbd>Q</kbd> <kbd>W</kbd></td><td>Drink an HP or MP potion (restores 45%).</td></tr>`;
    for(const k in held) release(k);
    document.getElementById('resumeBtn').focus();
  }
}
document.getElementById('resumeBtn').addEventListener('click',togglePause);
document.getElementById('classBtn').addEventListener('click',()=>{
  writeSave(); paused=false; pauseEl.hidden=true; running=false; delete world.players[ME]; buildCards(); titleEl.hidden=false;
});

fit(); buildCards();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{});
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
})();
</script>
