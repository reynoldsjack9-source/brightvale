<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightvale Wardrobe</title>
<style>
:root{color-scheme:light;--ink:#312238;--muted:#655a6a;--line:#e7ded1;--paper:#fffaf0;--accent:#ca602f;--soft:#f9e8d8}
*{box-sizing:border-box}body{margin:0;background:#f6f1e6;color:var(--ink);font:15px system-ui,sans-serif}button,a{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #3d78c5;outline-offset:3px}
header{max-width:1100px;margin:auto;padding:25px 22px 13px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1,h2,p{margin:0}h1{font-size:clamp(28px,5vw,44px);font-weight:850;letter-spacing:-.05em}h2{font-size:22px;letter-spacing:-.025em}a{color:#5e3e3c;font-weight:750;text-underline-offset:3px}
main{max-width:1100px;margin:auto;padding:10px 22px 28px}.class-tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.class-tabs button,.reset{border:1px solid #d8cabd;border-radius:10px;background:var(--paper);padding:9px 14px;font-weight:750}.class-tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(275px, .95fr) minmax(360px, 1.2fr);gap:18px;align-items:start}.preview,.inventory{border:1px solid #ded0be;background:var(--paper);border-radius:19px;overflow:hidden;box-shadow:0 3px 0 #e8ddcb}.scene{position:relative;isolation:isolate;display:grid;place-items:center;min-height:370px;background:linear-gradient(#afdffc,#e5f3dc 69%,#9fc373 70%,#a9ca81)}.scene::before,.scene::after{content:'';position:absolute;z-index:-1;bottom:27%;width:80%;height:23%;border-radius:100% 100% 0 0;background:#c0dc9c;transform:rotate(-8deg)}.scene::before{left:-25%}.scene::after{right:-30%;transform:rotate(9deg);background:#b6d593}.scene{overflow:hidden}.portrait{width:min(100%,340px);height:auto;max-height:350px;aspect-ratio:1;filter:drop-shadow(0 4px 0 #41263718)}.caption{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.caption p{color:var(--muted);margin-top:3px}.reset{padding:7px 10px;white-space:nowrap}
.inventory{padding:15px}.inventory h2{padding:1px 3px 8px}.slot{display:grid;grid-template-columns:74px 1fr 1fr;gap:8px;align-items:stretch;padding:8px 0;border-top:1px solid var(--line)}.slot h3{font-size:13px;align-self:center;margin:0 0 0 3px}.piece{border:1px solid var(--line);border-radius:11px;background:#fffdf7;display:grid;grid-template-columns:38px 1fr;align-items:center;gap:7px;padding:5px 7px;text-align:left;min-height:48px;font-size:13px;font-weight:750}.piece:hover{border-color:#b8775d}.piece[aria-pressed=true]{background:var(--soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.piece img{width:38px;height:36px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:760px){.layout{grid-template-columns:1fr}.scene{min-height:280px}.portrait{max-height:275px;width:auto;max-width:100%}.preview{max-width:none}}
@media(max-width:405px){header,main{padding-inline:12px}.inventory{padding:10px}.slot{grid-template-columns:56px 1fr 1fr;gap:5px}.piece{grid-template-columns:28px 1fr;padding:4px;gap:4px}.piece img{width:28px}}
</style>
</head>
<body>
<header><h1>Brightvale Wardrobe</h1><a href="index.html" id="back">Back to game</a></header>
<main>
  <nav class="class-tabs" aria-label="Class" id="classes"></nav>
  <div class="layout">
    <section class="preview" aria-labelledby="hero-name">
      <div class="scene"><canvas class="portrait" id="portrait" width="256" height="256" role="img" aria-labelledby="hero-name"></canvas></div>
      <div class="caption"><div><h2 id="hero-name"></h2><p>Choose a piece to equip it.</p></div><button class="reset" id="reset" type="button">Reset outfit</button></div>
    </section>
    <section class="inventory" aria-labelledby="inventory-title"><h2 id="inventory-title">Inventory</h2><div id="inventory"></div></section>
  </div>
  <p class="sr" id="status" role="status"></p>
</main>
<script src="wardrobe.js"></script>
</body>
</html>
